<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মেসেজ — Varsity Network</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .msg-shell { display: flex; height: calc(100vh - 65px); }
  .msg-sidebar { width: 300px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .msg-sidebar-item { display: flex; gap: 10px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .msg-sidebar-item:hover, .msg-sidebar-item.active { background: var(--surface); }
  .msg-sidebar-item .name { font-weight: 700; font-size: 13.5px; }
  .msg-sidebar-item .preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .msg-thread { flex: 1; display: flex; flex-direction: column; }
  .msg-thread-header { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-family: 'Sora'; }
  .msg-thread-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .msg-bubble { max-width: 70%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
  .msg-bubble.mine { align-self: flex-end; background: var(--gold); color: #1a1206; border-bottom-right-radius: 4px; }
  .msg-bubble.theirs { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
  .msg-input-row { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); }
  .msg-input-row input { flex: 1; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; align-self: center; }
  @media (max-width: 700px) {
    .msg-sidebar { width: 100%; }
    .msg-sidebar.has-thread-open { display: none; }
    .msg-thread { display: none; }
    .msg-thread.open { display: flex; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="app-nav"></div>

  <div class="msg-shell">
    <div class="msg-sidebar" id="msg-sidebar">
      <div class="empty-state">লোড হচ্ছে...</div>
    </div>
    <div class="msg-thread" id="msg-thread">
      <div class="empty-state" style="margin:auto">বাম পাশ থেকে একটা কনভারসেশন সিলেক্ট করো।</div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/presence.js"></script>
<script>renderNav("messages");</script>
<script src="/js/messages.js"></script>
</body>
</html>
