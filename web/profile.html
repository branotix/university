<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রোফাইল — Varsity Network</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .cover { height: 160px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--surface-2), var(--card)); background-size: cover; background-position: center; position: relative; margin-bottom: 54px; }
  .cover .avatar-ring { position: absolute; bottom: -36px; left: 24px; width: 88px; height: 88px; border: 4px solid var(--bg); }
  .cover .avatar-ring .avatar-inner { font-size: 30px; }
  .profile-header-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 8px 0; flex-wrap: wrap; }
  .completion-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 10px 0 4px; }
  .completion-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); }
  .info-row { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--text-muted); margin-bottom: 4px; }
  .edit-field { margin-bottom: 12px; }
  .edit-field label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:4px; font-weight:600; }
  .edit-field input, .edit-field textarea { width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:'Inter'; font-size:13.5px; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="app-nav"></div>

  <main class="container" style="max-width: 760px">
    <div class="cover" id="cover-el">
      <div class="avatar-ring" id="avatar-ring"><div class="avatar-inner" id="avatar-initial">?</div></div>
    </div>

    <div class="profile-header-actions" id="header-actions"></div>

    <div style="padding: 0 8px">
      <h1 id="p-name" style="margin:0 0 2px">লোড হচ্ছে...</h1>
      <div class="info-row" id="p-headline"></div>
      <div class="info-row" id="p-role-badge"></div>
      <div class="info-row" id="p-location"></div>
      <div class="info-row" id="p-languages"></div>
      <div class="info-row" id="p-joined"></div>

      <div id="own-profile-banner"></div>

      <div class="stat-grid" id="stat-grid" style="margin-top:18px"></div>

      <div class="card" style="margin-top: 8px">
        <div class="section-title"><h2>সম্পর্কে</h2></div>
        <p id="p-about" class="muted" style="white-space:pre-wrap; margin:0">কিছু লেখা নেই।</p>
      </div>

      <div class="card" id="teacher-info-card" style="margin-top:16px; display:none">
        <div class="section-title"><h2>একাডেমিক তথ্য</h2></div>
        <div class="info-row"><strong style="color:var(--text)">বিশ্ববিদ্যালয়:</strong>&nbsp;<span id="p-university"></span></div>
        <div class="info-row"><strong style="color:var(--text)">এক্সপার্টাইজ:</strong>&nbsp;<span id="p-expertise"></span></div>
      </div>
    </div>
  </main>
</div>

<!-- Edit profile modal -->
<div id="edit-modal" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:480px; max-height:85vh; overflow-y:auto">
    <h3 style="margin-top:0">প্রোফাইল এডিট করো</h3>

    <div class="edit-field">
      <label>প্রোফাইল ছবি</label>
      <input type="file" id="edit-avatar-file" accept="image/*">
    </div>
    <div class="edit-field">
      <label>কভার ছবি</label>
      <input type="file" id="edit-cover-file" accept="image/*">
    </div>
    <div class="edit-field"><label>হেডলাইন</label><input type="text" id="edit-headline" maxlength="150" placeholder="যেমন: CSE @ BUET | Physics Mentor"></div>
    <div class="edit-field"><label>সম্পর্কে (About)</label><textarea id="edit-about" rows="4" placeholder="নিজের সম্পর্কে লেখো..."></textarea></div>
    <div class="edit-field"><label>লোকেশন</label><input type="text" id="edit-location" placeholder="যেমন: Dhaka, Bangladesh"></div>
    <div class="edit-field"><label>ভাষা</label><input type="text" id="edit-languages" placeholder="যেমন: Bengali, English"></div>

    <div id="edit-teacher-fields" style="display:none">
      <div class="divider"></div>
      <div class="edit-field"><label>বিশ্ববিদ্যালয়</label><input type="text" id="edit-university"></div>
      <div class="edit-field"><label>এক্সপার্টাইজ</label><input type="text" id="edit-expertise"></div>
      <div class="edit-field"><label>বায়ো (টিচার হিসেবে)</label><textarea id="edit-bio" rows="3"></textarea></div>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px">
      <button class="btn btn-secondary btn-block" onclick="document.getElementById('edit-modal').style.display='none'">বাতিল</button>
      <button class="btn btn-primary btn-block" id="save-profile-btn">সেভ করো</button>
    </div>
  </div>
</div>

<!-- Package purchase modal (booking a call) -->
<div id="pkg-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="pkg-modal-title" style="margin-top:0">কল প্যাকেজ বেছে নাও</h3>
    <div id="pkg-list">
      <div class="pkg-option" data-mins="10" data-amount="25"><span class="mins">১০ মিনিট</span><span class="price">৳ ২৫</span></div>
      <div class="pkg-option" data-mins="20" data-amount="45"><span class="mins">২০ মিনিট</span><span class="price">৳ ৪৫</span></div>
      <div class="pkg-option" data-mins="30" data-amount="65"><span class="mins">৩০ মিনিট</span><span class="price">৳ ৬৫</span></div>
      <div class="pkg-option" data-mins="60" data-amount="120"><span class="mins">১ ঘণ্টা</span><span class="price">৳ ১২০</span></div>
    </div>
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn btn-secondary btn-block" onclick="document.getElementById('pkg-modal').style.display='none'">বাতিল</button>
      <button class="btn btn-primary btn-block" id="confirm-pkg-btn" disabled>কল শুরু করো</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/presence.js"></script>
<script>renderNav("profile");</script>
<script src="/js/profile.js"></script>
</body>
</html>
